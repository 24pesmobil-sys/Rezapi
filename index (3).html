<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c1424">
<title>رضا پیردشتی | مشاور تحصیلی</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea;--card:#ffffff;--ink:#14213d;--muted:#667089;--gold:#9a7a3a;--gold-soft:#c9a75f;--line:#e6dfcf;
  --shadow:0 1px 2px rgba(20,33,61,.05),0 10px 28px rgba(20,33,61,.08);
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1222;--card:#141d33;--ink:#f3efe4;--muted:#a3adc2;--gold:#d3b277;--line:#243050;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0b1222;--card:#141d33;--ink:#f3efe4;--muted:#a3adc2;--gold:#d3b277;--line:#243050;--shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35)}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:"Vazirmatn",Tahoma,"Segoe UI",sans-serif;min-height:100vh;padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));-webkit-font-smoothing:antialiased}

.hero{position:relative;text-align:center;color:#f6f1e4;
  padding:calc(44px + env(safe-area-inset-top,0px)) 24px 38px;
  background:radial-gradient(130% 85% at 50% 0%,#2f4d74 0%,#172844 52%,#0c1424 100%);
  border-radius:0 0 40px 40px;border-bottom:1px solid rgba(201,167,95,.45);overflow:hidden}
.hero::before{content:"";position:absolute;inset:0;opacity:.07;pointer-events:none;
  background-image:linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%),linear-gradient(45deg,#fff 25%,transparent 25%,transparent 75%,#fff 75%);
  background-size:26px 26px;background-position:0 0,13px 13px;
  -webkit-mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 40%,transparent 85%);mask-image:linear-gradient(to bottom,#000 0%,rgba(0,0,0,.6) 40%,transparent 85%)}
.hero>*{position:relative}

.photo{width:184px;height:184px;margin:0 auto;border-radius:50%;padding:5px;
  background:conic-gradient(from 210deg,#e8cf93,#a98a48,#f3dfae,#a98a48,#e8cf93);
  box-shadow:0 14px 36px rgba(0,0,0,.45),0 0 0 8px rgba(201,167,95,.12)}
.photo .in{width:100%;height:100%;border-radius:50%;padding:4px;background:#0c1424}
.photo img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:center 20%;display:block}

h1{margin-top:26px;font-size:30px;font-weight:800;line-height:1.4;letter-spacing:-.2px}
.cred{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;margin:12px auto 0;max-width:340px;font-size:14px;font-weight:600;color:var(--gold-soft)}
.cred i{width:4px;height:4px;border-radius:50%;background:var(--gold-soft);opacity:.8}
.cred span{white-space:nowrap}
.role{margin:6px auto 0;max-width:300px;font-size:14px;font-weight:400;line-height:2;color:#d8d2c0}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:18px}
.orn i{display:block;width:48px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft))}
.orn i:last-child{transform:scaleX(-1)}
.orn b{width:7px;height:7px;background:var(--gold-soft);transform:rotate(45deg)}

main{max-width:440px;margin:28px auto 0;padding:0 20px;display:flex;flex-direction:column;gap:12px}
a.item{position:relative;display:flex;align-items:center;gap:16px;padding:16px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);color:inherit;text-decoration:none;-webkit-tap-highlight-color:transparent;transition:transform .15s ease,border-color .2s ease;animation:rise .6s cubic-bezier(.2,.7,.2,1) both}
a.item:nth-child(2){animation-delay:.08s}
a.item:nth-child(3){animation-delay:.16s}
a.item:active{transform:scale(.985);border-color:var(--gold)}
.ico{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;color:#fff;background:linear-gradient(145deg,#c9a75f,#8f6f2f);box-shadow:0 4px 10px rgba(154,122,58,.35)}
.ico svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.txt{flex:1;min-width:0;text-align:right}
.lbl{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:.2px}
.val{display:block;margin-top:3px;font-size:17px;font-weight:600;line-height:1.5}
.num{direction:ltr;unicode-bidi:isolate;text-align:right;letter-spacing:.6px}
.go{flex:none;width:18px;height:18px;color:var(--gold);opacity:.8}
.go svg{width:100%;height:100%;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.foot{margin-top:20px;text-align:center;font-size:12px;color:var(--muted);letter-spacing:.3px}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){a.item{animation:none;transition:none}}
</style>
</head>
